name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  # Manual re-run: pick an existing tag as the ref in the "Run workflow" dialog.
  # GITHUB_REF_NAME is then that tag, so VERSION resolves exactly as on a push.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # pushes the Maven layout to the gh-pages branch
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download chart.html from upstream release
        env:
          GH_TOKEN: ${{ secrets.CHARTS_REPO_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p acttradercharts/src/main/assets
          gh release download "v${VERSION}" \
            --repo acttrader/ActCharts \
            --pattern "chart.html" \
            --output acttradercharts/src/main/assets/chart.html \
            --clobber

      # Staged separately, not via the aggregate `publish` task: GitHub Packages
      # answers 409 Conflict when a version already exists, and that used to fail
      # the whole build before the public mirror below ever ran. The public repo
      # is the one consumers use, so it publishes first and must succeed.
      - name: Publish library (public Pages repo)
        run: ./gradlew :acttradercharts:publishReleasePublicationToPagesRepository

      - name: Publish library (GitHub Packages)
        # 409 on re-publishing an existing version is expected and harmless.
        continue-on-error: true
        run: ./gradlew :acttradercharts:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Packages Maven requires a token on every read, even for public
      # packages, so consumers would each need a PAT. Mirroring the same
      # artifacts to GitHub Pages gives an anonymous, credential-free repo at
      # https://<owner>.github.io/<repo>/maven for the identical coordinates.
      - name: Mirror to the public Pages Maven repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC=acttradercharts/build/pages-repo
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC is missing — the 'pages' publication did not run"
            exit 1
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Reuse gh-pages if it exists; create it as an orphan on first publish
          # so the branch carries only the Maven tree, not the source history.
          if ! git clone --depth 1 --branch gh-pages "$REMOTE" pages 2>/dev/null; then
            git clone --depth 1 "$REMOTE" pages
            cd pages
            git checkout --orphan gh-pages
            git rm -rfq .
            cd ..
          fi

          mkdir -p pages/maven
          cp -r "$SRC"/. pages/maven/
          # Pages skips paths beginning with `_` unless Jekyll is disabled.
          touch pages/.nojekyll

          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "publish ${GITHUB_REF_NAME}"
          git push origin gh-pages
